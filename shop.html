<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Rory X</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: white; 
            font-family: -apple-system, sans-serif; 
            margin: 0; 
            padding-top: 140px; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Professional Centered 3-Column Navigation Grid */
        nav { 
            position: fixed; top: 0; left: 0; width: 100%; height: 110px; 
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center; 
            padding: 0 40px; z-index: 9998; 
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08); 
            transition: background 0.3s ease, border-bottom 0.3s ease;
        }
        
        .nav-left { display: flex; justify-content: flex-start; }
        .nav-logo { height: 100px; width: auto; }
        
        /* Centered Menu Links */
        nav ul { display: flex; list-style: none; gap: 40px; align-items: center; justify-content: center; }
        nav ul li a { text-decoration: none; color: #f5f5f7; font-size: 14px; opacity: 0.7; transition: 0.3s; font-weight: 500; }
        nav ul li a:hover, nav ul li a.active { opacity: 1; }

        /* Controls Block Aligned to Right */
        .nav-right-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
        }

        /* --- Live Stock Dropdown Layout Element --- */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .stock-btn {
            background: rgba(52, 199, 89, 0.15);
            color: #34c759;
            border: 1px solid rgba(52, 199, 89, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .stock-btn:hover {
            background: rgba(52, 199, 89, 0.25);
            transform: scale(1.03);
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 12px);
            background: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            width: 180px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            z-index: 10000;
            overflow: hidden;
            animation: menuFadeIn 0.2s ease forwards;
        }
        @keyframes menuFadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-menu.active { display: block; }

        .dropdown-menu a {
            display: block;
            color: #f5f5f7;
            padding: 12px 16px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            opacity: 0.9;
            transition: background 0.2s, opacity 0.2s;
        }
        .dropdown-menu a:hover {
            background: rgba(255, 255, 255, 0.05);
            opacity: 1;
        }

        /* Cart Trigger Navbar Button */
        .cart-toggle-btn {
            background: rgba(255, 149, 0, 0.15);
            color: #ff9500;
            border: 1px solid rgba(255, 149, 0, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .cart-toggle-btn:hover {
            background: rgba(255, 149, 0, 0.25);
            transform: scale(1.03);
        }

        /* Theme Toggle Button Style */
        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.03);
        }

        /* --- SHOPPING CART SIDE PANEL --- */
        .cart-sidebar {
            position: fixed; top: 0; right: -400px; width: 400px; height: 100%;
            background: #1c1c1e; border-left: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5); z-index: 10001;
            display: flex; flex-direction: column; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cart-sidebar.open { right: 0; }
        .cart-header { padding: 30px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; }
        .cart-header h2 { font-size: 22px; font-weight: 600; }
        .close-cart-btn { background: none; border: none; color: #8e8e93; font-size: 24px; cursor: pointer; }
        .close-cart-btn:hover { color: #fff; }
        
        .cart-items-container { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; }
        .cart-empty-msg { color: #8e8e93; text-align: center; margin-top: 40px; font-size: 14px; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 0.5px solid rgba(255,255,255,0.08); }
        .item-details h4 { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
        .item-details p { font-size: 13px; color: #8e8e93; }
        .item-actions { display: flex; align-items: center; gap: 12px; }
        .quantity-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .quantity-btn:hover { background: rgba(255,255,255,0.2); }
        .remove-item-btn { background: none; border: none; color: #ff3b30; cursor: pointer; font-size: 12px; margin-left: 8px; }

        .cart-footer { padding: 30px 24px; border-top: 1px solid rgba(255, 255, 255, 0.1); background: #121214; }
        .cart-total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 17px; font-weight: 600; }
        .checkout-btn { width: 100%; padding: 16px; background: #ff9500; color: white; border: none; border-radius: 14px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; text-align: center; text-decoration: none; display: block; }
        .checkout-btn:hover { background: #e08500; transform: scale(1.02); }

        /* Shop Grid */
        .container { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            flex-wrap: wrap; 
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px; 
            margin-bottom: 80px;
        }

        .product-card {
            background: #1c1c1e; 
            padding: 25px; 
            border-radius: 24px; 
            width: 260px;
            text-align: center; 
            border: 1px solid #333; 
            transition: transform 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover { transform: translateY(-8px); border-color: #444; }
           
        .img-box { 
            height: 180px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 15px;
        }

        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
           
        h3 { margin: 10px 0 5px; font-size: 20px; }
        .price-text { color: #8e8e93; margin-bottom: 15px; font-weight: 600; transition: color 0.3s ease; }

        select {
            width: 100%; padding: 12px; border-radius: 10px; background: #2c2c2e; 
            color: white; border: 1px solid #444; margin-bottom: 15px; outline: none;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        /* Stock Counter Styles */
        .stock-tag-container { min-height: 21px; }
        .stock-tag { font-size: 11px; font-weight: 600; margin-bottom: 15px; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; display: inline-block; }
        .in-stock { color: #34c759; background: rgba(52, 199, 89, 0.1); }
        .low-stock { color: #ff9500; background: rgba(255, 149, 0, 0.1); }
        .out-of-stock { color: #ff3b30; background: rgba(255, 59, 48, 0.1); }

        .buy-btn {
            width: 100%; padding: 14px; background: #2ecc71; color: white; 
            border: none; border-radius: 12px; font-weight: bold; cursor: pointer;
            transition: background 0.2s;
        }
        .buy-btn:hover { background: #27ae60; }
        
        .buy-btn.disabled { 
            background-color: #ffffff !important; 
            color: #1c1c1e !important; 
            cursor: not-allowed; 
        }

        /* --- LIGHT MODE RULES OVERRIDES --- */
        body.light-mode { background-color: #ffffff; color: #000000; }
        body.light-mode nav { background: rgba(255, 255, 255, 0.8); border-bottom: 0.5px solid rgba(0, 0, 0, 0.1); }
        body.light-mode nav ul li a { color: #000000; opacity: 0.7; }
        body.light-mode nav ul li a:hover, body.light-mode nav ul li a.active { opacity: 1; }
        
        body.light-mode .stock-btn {
            background: rgba(39, 174, 96, 0.1);
            color: #27ae60;
            border: 1px solid rgba(39, 174, 96, 0.25);
        }
        body.light-mode .stock-btn:hover { background: rgba(39, 174, 96, 0.18); }
        body.light-mode .dropdown-menu {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        body.light-mode .dropdown-menu a { color: #000000; }
        body.light-mode .dropdown-menu a:hover { background: rgba(0, 0, 0, 0.04); }

        body.light-mode .cart-sidebar { background: #ffffff; color: #000000; border-left: 1px solid rgba(0,0,0,0.1); }
        body.light-mode .cart-footer { background: #f5f5f7; }
        body.light-mode .quantity-btn { background: rgba(0,0,0,0.05); color: black; }
        body.light-mode .quantity-btn:hover { background: rgba(0,0,0,0.1); }

        body.light-mode .theme-toggle-btn { background: rgba(0, 0, 0, 0.05); color: #000000; border: 1px solid rgba(0, 0, 0, 0.15); }
        body.light-mode .theme-toggle-btn:hover { background: rgba(0, 0, 0, 0.1); }
        body.light-mode .product-card { background: #f5f5f7; border: 1px solid #d1d1d6; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        body.light-mode .product-card:hover { border-color: #a1a1a6; }
        body.light-mode .price-text { color: #48484a; }
        body.light-mode select { background: #ffffff; color: #000000; border: 1px solid #d1d1d6; }
        body.light-mode .buy-btn.disabled { background-color: #000000 !important; color: #ffffff !important; }

        @media (max-width: 900px) {
            nav { display: flex; flex-direction: column; height: auto; padding: 20px; gap: 15px; }
            .nav-right-controls { width: 100%; justify-content: center; }
            nav ul { gap: 20px; }
            .cart-sidebar { width: 100%; right: -100%; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <img src="RoryX.png" alt="Rory X" class="nav-logo" id="navLogo">
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html" class="active">Shop</a></li>
            <li><a href="Clothing & Accessories.html">Clothing & Accessories</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>
        
        <div class="nav-right-controls">
            <div class="dropdown">
                <button class="stock-btn" id="stockBtn" onclick="toggleStockMenu(event)">📈 Live Stock</button>
                <div class="dropdown-menu" id="stockDropdown">
                    <a href="admin.html">View Public Stock</a>
                    <a href="privatestock.html" style="border-top: 1px solid rgba(255,255,255,0.06);">View Private Stock</a>
                </div>
            </div>
            
            <button class="cart-toggle-btn" onclick="toggleCartSidebar()">🛒 Cart (<span id="cartCount">0</span>)</button>
            <button class="theme-toggle-btn" onclick="toggleDisplayTheme()" id="themeBtn">☀️ Light Mode</button>
        </div>
    </nav>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Your Shopping Cart</h2>
            <button class="close-cart-btn" onclick="toggleCartSidebar()">✕</button>
        </div>
        <div class="cart-items-container" id="cartItemsBox">
            <p class="cart-empty-msg">Your cart is empty.</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Total:</span>
                <span id="cartTotalLabel">£0.00</span>
            </div>
            <button class="checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
        </div>
    </div>
     
    <div class="container">
        <div class="product-card" data-product-name="Dehydrated Water">
            <div>
                <div class="img-box"><img src="waterbottle.png" alt="Water"></div>
                <h3>Dehydrated Water</h3>
                <p class="price-text">£3.50</p>
            </div>
            <div>
                <div class="stock-tag-container"></div>
                <button class="buy-btn" onclick="addItemToCart('Dehydrated Water', 3.50)">Add to Cart</button>
            </div>
        </div>

        <div class="product-card" data-is-variant="true">
            <div>
                <div class="img-box"><img src="air.png" alt="Air"></div>
                <h3>Air</h3>
                <p id="airPriceLabel" class="price-text">£5.00</p>
                <select id="airSize" onchange="updateAirPrice()">
                    <option value="5.00">Small - £5.00</option>
                    <option value="10.00">Medium - £10.00</option>
                    <option value="15.00">Large - £15.00</option>
                </select>
            </div>
            <div>
                <div class="stock-tag-container" id="airStockContainer"></div>
                <button id="airBuyBtn" class="buy-btn" onclick="addAirToCart()">Add to Cart</button>
            </div>
        </div>

        <div class="product-card" data-product-name="Unlit Fire">
            <div>
                <div class="img-box"><img src="unlitfire.png" alt="Fire"></div>
                <h3>Unlit Fire</h3>
                <p class="price-text">£7.85</p>
            </div>
            <div>
                <div class="stock-tag-container"></div>
                <button class="buy-btn" onclick="addItemToCart('Unlit Fire', 7.85)">Add to Cart</button>
            </div>
        </div>

        <div class="product-card" data-product-name="Boxes">
            <div>
                <div class="img-box"><img src="Boxes.png" alt="Boxes"></div>
                <h3>Boxes</h3>
                <p class="price-text">£19.75</p>
            </div>
            <div>
                <div class="stock-tag-container"></div>
                <button class="buy-btn" onclick="addItemToCart('Boxes', 19.75)">Add to Cart</button>
            </div>
        </div>
    </div>

    <script>
        // --- Core Cart Engine Functions ---
        let cart = [];

        function loadCart() {
            const savedCart = localStorage.getItem('roryx-cart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            updateCartUI();
        }

        function saveCart() {
            localStorage.setItem('roryx-cart', JSON.stringify(cart));
            updateCartUI();
        }

        function toggleCartSidebar() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }

        function addItemToCart(name, price) {
            const parsedPrice = parseFloat(price);
            const existingItem = cart.find(item => item.name === name);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ name: name, price: parsedPrice, quantity: 1 });
            }
            saveCart();
            
            // Open sidebar automatically so user knows it was added
            document.getElementById('cartSidebar').classList.add('open');
        }

        function addAirToCart() {
            const dropdown = document.getElementById('airSize');
            const price = dropdown.value;
            const sizeLabel = dropdown.options[dropdown.selectedIndex].text.split(' - ')[0];
            addItemToCart('Air (' + sizeLabel + ')', price);
        }

        function changeQuantity(name, amount) {
            const item = cart.find(item => item.name === name);
            if (item) {
                item.quantity += amount;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.name !== name);
                }
                saveCart();
            }
        }

        function removeItem(name) {
            cart = cart.filter(item => item.name !== name);
            saveCart();
        }

        function updateCartUI() {
            const cartItemsBox = document.getElementById('cartItemsBox');
            const cartCount = document.getElementById('cartCount');
            const cartTotalLabel = document.getElementById('cartTotalLabel');
            
            let totalItems = 0;
            let totalPrice = 0;
            
            if (cart.length === 0) {
                cartItemsBox.innerHTML = '<p class="cart-empty-msg">Your cart is empty.</p>';
            } else {
                cartItemsBox.innerHTML = '';
                cart.forEach(item => {
                    totalItems += item.quantity;
                    totalPrice += (item.price * item.quantity);
                    
                    cartItemsBox.innerHTML += `
                        <div class="cart-item">
                            <div class="item-details">
                                <h4>${item.name}</h4>
                                <p>£${item.price.toFixed(2)} × ${item.quantity}</p>
                            </div>
                            <div class="item-actions">
                                <button class="quantity-btn" onclick="changeQuantity('${item.name}', -1)">-</button>
                                <button class="quantity-btn" onclick="changeQuantity('${item.name}', 1)">+</button>
                                <button class="remove-item-btn" onclick="removeItem('${item.name}')">Remove</button>
                            </div>
                        </div>
                    `;
                });
            }
            
            cartCount.innerText = totalItems;
            cartTotalLabel.innerText = '£' + totalPrice.toFixed(2);
        }

        function proceedToCheckout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            // Bundles all your current items into a compressed query string to carry to your payment module
            const itemsParam = encodeURIComponent(JSON.stringify(cart));
            window.location.href = `pay.html?cart=${itemsParam}`;
        }

        // --- Navigation Dropdown Control ---
        function toggleStockMenu(event) {
            event.stopPropagation();
            document.getElementById('stockDropdown').classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('stockDropdown');
            const button = document.getElementById('stockBtn');
            if (dropdown && !button.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.classList.remove('active');
            }
        });

        function updateAirPrice() {
            const price = document.getElementById('airSize').value;
            document.getElementById('airPriceLabel').innerText = "£" + price;
            checkLiveStock();
        }

        // --- Live Database Tracking Sync Engine ---
        async function checkLiveStock() {
            try {
                const response = await fetch('/api/get-stock?t=' + Date.now());
                if (!response.ok) throw new Error('Database response failed');
                const liveStock = await response.json();
                 
                // 1. Process standard cards
                const standardCards = document.querySelectorAll('[data-product-name]');
                standardCards.forEach(card => {
                    const name = card.getAttribute('data-product-name');
                    const btn = card.querySelector('.buy-btn');
                    const tagBox = card.querySelector('.stock-tag-container');

                    if (liveStock && Object.prototype.hasOwnProperty.call(liveStock, name)) {
                        const count = parseInt(liveStock[name]);
                        applyStockUI(count, btn, tagBox);
                    }
                });

                // 2. Process variable Air card
                const airDropdown = document.getElementById('airSize');
                if (airDropdown) {
                    const currentSize = airDropdown.options[airDropdown.selectedIndex].text.split(' - ')[0];
                    const airKeyName = `Air (${currentSize})`; 
                    const airBtn = document.getElementById('airBuyBtn');
                    const airTagBox = document.getElementById('airStockContainer');

                    if (liveStock && Object.prototype.hasOwnProperty.call(liveStock, airKeyName)) {
                        const count = parseInt(liveStock[airKeyName]);
                        applyStockUI(count, airBtn, airTagBox);
                    } else {
                        airBtn.innerText = "Add to Cart";
                        airBtn.classList.remove('disabled');
                        airBtn.disabled = false;
                        airTagBox.innerHTML = "";
                    }
                }
            } catch (err) {
                console.error("Live stock lookup failed, retrying on next pass:", err);
            }
        }

        // Shared helper script for stock layout states
        function applyStockUI(count, buttonElement, tagBoxElement) {
            if (count <= 0 || isNaN(count)) {
                tagBoxElement.innerHTML = `<span class="stock-tag out-of-stock">Sold Out</span>`;
                buttonElement.innerText = "Sold Out";
                buttonElement.classList.add('disabled');
                buttonElement.disabled = true;
            } else if (count <= 3) {
                tagBoxElement.innerHTML = `<span class="stock-tag low-stock">Running Low: ${count} Left</span>`;
                buttonElement.innerText = "Add to Cart";
                buttonElement.classList.remove('disabled');
                buttonElement.disabled = false;
            } else {
                tagBoxElement.innerHTML = `<span class="stock-tag in-stock">${count} In Stock</span>`;
                buttonElement.innerText = "Add to Cart";
                buttonElement.classList.remove('disabled');
                buttonElement.disabled = false;
            }
        }

        // --- Theme Engine Functions ---
        function toggleDisplayTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            const logo = document.getElementById('navLogo');
            
            body.classList.toggle('light-mode');
            
            if(body.classList.contains('light-mode')) {
                btn.innerHTML = "🌙 Dark Mode";
                logo.src = "roryxlite.png";
                localStorage.setItem('roryx-theme', 'light');
            } else {
                btn.innerHTML = "☀️ Light Mode";
                logo.src = "RoryX.png";
                localStorage.setItem('roryx-theme', 'dark');
            }
        }

        // Initialize and sync background tasks
        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem('roryx-theme');
            if(savedTheme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeBtn').innerHTML = "🌙 Dark Mode";
                document.getElementById('navLogo').src = "roryxlite.png";
            }

            loadCart();
            checkLiveStock();
            setInterval(checkLiveStock, 5000);
        });
    </script>
</body>
</html>
