<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Rory X</title>
    <style>
        body { 
            background: #000; 
            color: white; 
            font-family: -apple-system, sans-serif; 
            margin: 0; 
            padding-top: 120px; 
        }

        /* The Professional Header Layout */
        nav {
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%; 
            height: 90px;
            display: grid;
            grid-template-columns: 1fr auto 1fr; 
            align-items: center;
            padding: 0 40px; 
            background: #000; 
            z-index: 1000;
            box-sizing: border-box;
            border-bottom: 1px solid #1c1c1e;
        }

        .logo-section {
            display: flex;
            justify-content: flex-start;
        }

        .logo-section img {
            height: 40px; 
            width: auto;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a { 
            color: white; 
            text-decoration: none; 
            font-size: 15px; 
            font-weight: 500;
            opacity: 0.6; 
            transition: opacity 0.2s;
        }

        .nav-links a:hover, .nav-links a.active { 
            opacity: 1; 
        }

        /* Shop Grid */
        .container { 
            display: flex; 
            justify-content: center; 
            gap: 25px; 
            flex-wrap: wrap; 
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px; 
        }

        .product-card {
            background: #1c1c1e; 
            padding: 25px; 
            border-radius: 24px; 
            width: 260px;
            text-align: center; 
            border: 1px solid #333; 
            transition: transform 0.3s ease;
        }

        .product-card:hover { transform: translateY(-8px); border-color: #444; }
        
        .img-box { 
            height: 180px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 15px;
        }

        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        h3 { margin: 10px 0 5px; font-size: 20px; }
        .price-text { color: #8e8e93; margin-bottom: 15px; font-weight: 600; }

        select {
            width: 100%; padding: 12px; border-radius: 10px; background: #2c2c2e; 
            color: white; border: 1px solid #444; margin-bottom: 15px; outline: none;
        }

        .buy-btn {
            width: 100%; padding: 14px; background: #2ecc71; color: white; 
            border: none; border-radius: 12px; font-weight: bold; cursor: pointer;
            transition: background 0.2s;
        }
        .buy-btn:hover { background: #27ae60; }
    </style>
</head>
<body>

    <nav>
        <div class="logo-section">
            <img src="RoryX.png" alt="Rory X Logo">
        </div>
        
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html" class="active">Shop</a>
            <a href="Clothing & Accessories.html">Clothing & Accessories</a>
            <a href="about.html">About Us</a>
        </div>
        
        <div></div>
    </nav>

    <div class="container">
        <div class="product-card">
            <div class="img-box"><img src="waterbottle.png" alt="Water"></div>
            <h3>Dehydrated Water</h3>
            <p class="price-text">£3.50</p>
            <button class="buy-btn" onclick="goToPay('Dehydrated Water', '3.50')">Buy Now</button>
        </div>

        <div class="product-card">
            <div class="img-box"><img src="air.png" alt="Air"></div>
            <h3>Air</h3>
            <p id="airPriceLabel" class="price-text">£5.00</p>
            <select id="airSize" onchange="updateAirPrice()">
                <option value="5.00">Small - £5.00</option>
                <option value="10.00">Medium - £10.00</option>
                <option value="15.00">Large - £15.00</option>
            </select>
            <button class="buy-btn" onclick="buyAir()">Buy Now</button>
        </div>

        <div class="product-card">
            <div class="img-box"><img src="unlitfire.png" alt="Fire"></div>
            <h3>Unlit Fire</h3>
            <p class="price-text">£7.85</p>
            <button class="buy-btn" onclick="goToPay('Unlit Fire', '7.85')">Buy Now</button>
        </div>

        <div class="product-card">
            <div class="img-box"><img src="Boxes.png" alt="Boxes"></div>
            <h3>Boxes</h3>
            <p class="price-text">£19.75</p>
            <button class="buy-btn" onclick="goToPay('Boxes', '19.75')">Buy Now</button>
        </div>
    </div>

    <script>
        // Main function to send standard items to payment page
        function goToPay(name, price) {
            window.location.href = `pay.html?item=${encodeURIComponent(name)}&price=${price}`;
        }

        // Updates the text label when the air size changes
        function updateAirPrice() {
            const price = document.getElementById('airSize').value;
            document.getElementById('airPriceLabel').innerText = "£" + price;
        }

        // Handles gathering custom dropdown properties for Air
        function buyAir() {
            const dropdown = document.getElementById('airSize');
            const price = dropdown.value;
            const sizeLabel = dropdown.options[dropdown.selectedIndex].text.split(' - ')[0];
            
            window.location.href = `pay.html?item=${encodeURIComponent('Air (' + sizeLabel + ')')}&price=${price}`;
        }
    </script>
</body>
</html>
