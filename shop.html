<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | Rory X</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #000;
    color: white;
    font-family: -apple-system, sans-serif;
    margin: 0;
    padding-top: 140px;
}

/* NAV */
nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 110px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(25px);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 40px;
    z-index: 9998;
}

.nav-left { display:flex; }
.nav-logo { height:100px; }

nav ul {
    display:flex;
    list-style:none;
    gap:40px;
    justify-content:center;
}

nav ul li a {
    color:#f5f5f7;
    text-decoration:none;
    opacity:0.7;
}
nav ul li a:hover, nav ul li a.active { opacity:1; }

/* SHOP */
.container {
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
    max-width:1200px;
    margin:0 auto;
}

.product-card {
    background:#1c1c1e;
    padding:25px;
    border-radius:20px;
    width:260px;
    text-align:center;
    border:1px solid #333;
}

.img-box { height:180px; display:flex; justify-content:center; align-items:center; }
.img-box img { max-width:100%; max-height:100%; }

.price-text { color:#aaa; margin:10px 0; }

select {
    width:100%;
    padding:10px;
    margin-bottom:10px;
    background:#2c2c2e;
    color:white;
}

.stock-tag {
    font-size:11px;
    padding:4px 10px;
    border-radius:6px;
    display:inline-block;
    margin-bottom:10px;
}

.in-stock { color:#34c759; background:rgba(52,199,89,0.1); }
.low-stock { color:#ff9500; background:rgba(255,149,0,0.1); }
.out-of-stock { color:#ff3b30; background:rgba(255,59,48,0.1); }

.buy-btn {
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2ecc71;
    color:white;
    cursor:pointer;
}

.buy-btn:disabled {
    background:#444;
    cursor:not-allowed;
}
</style>
</head>

<body>

<nav>
    <div class="nav-left">
        <img src="RoryX.png" class="nav-logo" id="navLogo">
    </div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html" class="active">Shop</a></li>
        <li><a href="Clothing & Accessories.html">Clothing & Accessories</a></li>
        <li><a href="about.html">About Us</a></li>
    </ul>

    <div></div>
</nav>

<div class="container">

    <!-- Dehydrated Water -->
    <div class="product-card" data-product-name="Dehydrated Water">
        <div class="img-box"><img src="waterbottle.png"></div>
        <h3>Dehydrated Water</h3>
        <p class="price-text">£3.50</p>
        <div class="stock-tag-container"></div>
        <button class="buy-btn" onclick="buyNow('Dehydrated Water', 3.50)">
            Buy Now
        </button>
    </div>

    <!-- Air -->
    <div class="product-card">
        <div class="img-box"><img src="air.png"></div>
        <h3>Air</h3>

        <p id="airPriceLabel" class="price-text">£5.00</p>

        <select id="airSize" onchange="updateAirPrice()">
            <option value="5.00">Small - £5.00</option>
            <option value="10.00">Medium - £10.00</option>
            <option value="15.00">Large - £15.00</option>
        </select>

        <div id="airStockContainer"></div>

        <button id="airBuyBtn" class="buy-btn" onclick="buyAirNow()">
            Buy Now
        </button>
    </div>

    <!-- Unlit Fire -->
    <div class="product-card" data-product-name="Unlit Fire">
        <div class="img-box"><img src="unlitfire.png"></div>
        <h3>Unlit Fire</h3>
        <p class="price-text">£7.85</p>
        <div class="stock-tag-container"></div>
        <button class="buy-btn" onclick="buyNow('Unlit Fire', 7.85)">
            Buy Now
        </button>
    </div>

    <!-- Boxes -->
    <div class="product-card" data-product-name="Boxes">
        <div class="img-box"><img src="Boxes.png"></div>
        <h3>Boxes</h3>
        <p class="price-text">£19.75</p>
        <div class="stock-tag-container"></div>
        <button class="buy-btn" onclick="buyNow('Boxes', 19.75)">
            Buy Now
        </button>
    </div>

</div>

<script>

// ---------------- BUY NOW ----------------
function buyNow(item, price) {
    const data = encodeURIComponent(JSON.stringify({ item, price }));
    window.location.href = `pay.html?data=${data}`;
}

function buyAirNow() {
    const size = document.getElementById("airSize");
    const price = parseFloat(size.value);
    const label = size.options[size.selectedIndex].text.split(" - ")[0];

    buyNow(`Air (${label})`, price);
}

// ---------------- PRICE UPDATE ----------------
function updateAirPrice() {
    const price = document.getElementById("airSize").value;
    document.getElementById("airPriceLabel").innerText = "£" + price;
    checkLiveStock();
}

// ---------------- STOCK SYSTEM ----------------
async function checkLiveStock() {
    try {
        const res = await fetch('/api/get-stock?t=' + Date.now());
        const liveStock = await res.json();

        document.querySelectorAll("[data-product-name]").forEach(card => {
            const name = card.getAttribute("data-product-name");
            const btn = card.querySelector(".buy-btn");
            const box = card.querySelector(".stock-tag-container");

            const count = parseInt(liveStock?.[name]);

            if (!count || count <= 0) {
                box.innerHTML = `<span class="stock-tag out-of-stock">Sold Out</span>`;
                btn.disabled = true;
            } else if (count <= 3) {
                box.innerHTML = `<span class="stock-tag low-stock">${count} Left</span>`;
                btn.disabled = false;
            } else {
                box.innerHTML = `<span class="stock-tag in-stock">${count} In Stock</span>`;
                btn.disabled = false;
            }
        });

        const size = document.getElementById("airSize");
        const label = size.options[size.selectedIndex].text.split(" - ")[0];
        const key = `Air (${label})`;

        const airCount = parseInt(liveStock?.[key]);
        const airBtn = document.getElementById("airBuyBtn");
        const airBox = document.getElementById("airStockContainer");

        if (!airCount || airCount <= 0) {
            airBox.innerHTML = `<span class="stock-tag out-of-stock">Sold Out</span>`;
            airBtn.disabled = true;
        } else {
            airBox.innerHTML = `<span class="stock-tag in-stock">${airCount} In Stock</span>`;
            airBtn.disabled = false;
        }

    } catch (err) {
        console.log("Stock error:", err);
    }
}

// start
document.addEventListener("DOMContentLoaded", () => {
    checkLiveStock();
    setInterval(checkLiveStock, 5000);
});

</script>

</body>
</html>
