<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Rory X</title>
    <link rel="icon" type="image/png" href="RoryX.png">
    <style>
        /* Pop-up Styles */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    z-index: 10001;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: #1c1c1e;
    padding: 30px;
    border-radius: 28px;
    width: 90%;
    max-width: 400px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.modal-content h2 { margin-bottom: 20px; font-size: 20px; }

.modal-content input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 12px;
    border: 1px solid #3a3a3c;
    background: #2c2c2e;
    color: white;
    font-size: 16px;
}

.confirm-btn {
    background-color: #34c759;
    color: white;
    border: none;
    padding: 14px;
    width: 100%;
    border-radius: 12px;
    font-weight: 600;
    margin-top: 15px;
    cursor: pointer;
}
        /* Mobile Fix */
@media (max-width: 768px) {
    nav {
        padding: 0 20px;
        height: 80px;
    }
    
    .nav-logo {
        height: 60px;
    }

    nav ul {
        gap: 15px; /* Brings tabs closer so they don't go off screen */
    }

    nav a {
        font-size: 12px;
    }

    .nav-spacer {
        display: none; /* Removes extra space on mobile */
    }

    .page-wrapper {
        margin-top: 120px; /* Adjusts for smaller nav */
        width: 90%;
    }

    .product-grid {
        grid-template-columns: 1fr; /* Forces products to stack 1 by 1 */
        gap: 20px;
    }

    .product-card {
        padding: 40px 20px;
        border-radius: 30px;
    }

    .product-card img {
        height: 200px; /* Shrinks images slightly for small screens */
    }

    .social-row {
        flex-direction: column; /* Stacks social links vertically if they don't fit */
        gap: 20px;
    }
}
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #000; color: #f5f5f7; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        nav { position: fixed; top: 0; width: 100%; height: 110px; background: rgba(0,0,0,0.4); backdrop-filter: blur(25px); display: flex; justify-content: space-between; align-items: center; padding: 0 40px; z-index: 9999; border-bottom: 0.5px solid rgba(255,255,255,0.08); }
        .nav-logo { height: 100px; }
        nav ul { display: flex; list-style: none; gap: 40px; }
        nav a { text-decoration: none; color: #fff; opacity: 0.7; font-size: 14px; }
        .shop-container { margin-top: 150px; width: 90%; max-width: 1200px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin-bottom: 50px; }
        .item-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 30px; padding: 20px; text-align: center; }
        .item-card img { width: 100%; height: 200px; object-fit: contain; }
        .btn-green { background: #34c759; color: #fff; border: none; padding: 12px; border-radius: 15px; cursor: pointer; width: 100%; font-weight: 600; }
        .modal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal-content { background: #1c1c1e; padding: 30px; border-radius: 25px; width: 300px; text-align: center; }
        footer { width: 100%; padding: 40px 20px; background: rgba(255,255,255,0.02); border-top: 1px solid rgba(255,255,255,0.08); text-align: center; color: #a1a1a6; font-size: 13px; }
    </style>
</head>
<body>
    <nav>
        <img src="RoryX.png" class="nav-logo">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="Clothing & Accessories.html">Clothing & Accessories</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>
        <div style="width: 100px;"></div>
    </nav>
    <div class="shop-container">
        <div class="item-card"><img src="waterbottle.png"><h3>Dehydrated Water</h3><p>£3.50</p><button class="btn-green">Buy Now</button></div>
        <div class="item-card"><img src="air.png"><h3>Air</h3><p>From £5.00</p><button class="btn-green" onclick="openM()">Select Size</button></div>
        <div class="item-card"><img src="unlitfire.png"><h3>Unlit Fire</h3><p>£7.85</p><button class="btn-green">Buy Now</button></div>
        <div class="item-card"><img src="Boxes.png"><h3>Boxes</h3><p>£19.75</p><button class="btn-green">Buy Now</button></div>
    </div>
    <div id="sizeModal" class="modal" onclick="closeM()"><div class="modal-content"><h2>Air Size</h2><button style="width:100%; margin: 5px 0;">Small - £5</button><button style="width:100%; margin: 5px 0;">Medium - £10</button><button style="width:100%; margin: 5px 0;">Large - £15</button></div></div>
<footer style="width: 100%; padding: 60px 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: center; color: #a1a1a6; font-size: 14px; margin-top: auto;">
        <div class="modal-overlay" id="orderModal">
    <div class="modal-content">
        <h2>Order Details</h2>
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="text" id="tutorGroup" placeholder="Tutor Group (e.g. 8HMR)" required>
        <button class="confirm-btn" id="finalConfirmBtn">Confirm Order</button>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
        <p>&copy; Copyright 2026 Rory X | Support: roryx.com@hotmail.com</p>
        
        <div style="display: flex; gap: 30px; justify-content: center; align-items: center;">
            
            <a href="https://www.tiktok.com/@roryx.com" target="_blank" class="social-link">
                <img src="tiktokimage.png" alt="TikTok">
                <span>Rory X</span>
            </a>

            <a href="https://www.instagram.com/roryx.com75/" target="_blank" class="social-link">
                <img src="instagramimage.svg" alt="Instagram">
                <span>Rory X</span>
            </a>

            <a href="https://www.youtube.com/channel/UC2tOn7rCPzN3jH5xoDFV5Fg" target="_blank" class="social-link">
                <img src="youtubeimage.png" alt="YouTube">
                <span>Rory X</span>
            </a>

        </div>
    </div>
</footer>

<style>
    /* Add this to your existing CSS section to style the links */
    .social-link {
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #a1a1a6;
        transition: 0.3s ease;
    }
    .social-link img {
        width: 20px;
        height: 20px;
        object-fit: contain;
    }
    .social-link span {
        font-weight: 500;
        font-size: 14px;
    }
    .social-link:hover {
        color: #fff;
        transform: translateY(-2px);
    }
</style>
    <script>function openM(){document.getElementById('sizeModal').style.display='flex'} function closeM(){document.getElementById('sizeModal').style.display='none'}</script>
</body>
</html>
