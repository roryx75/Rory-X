
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Rory X</title>
    <style>
        body { 
            background: #000; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        .card { 
            background: #1c1c1e; 
            padding: 40px 30px; 
            border-radius: 28px; 
            width: 360px; 
            text-align: center; 
            border: 1px solid #333; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #itemName { color: #8e8e93; font-size: 14px; text-transform: uppercase; margin-bottom: 8px; }
        .price { font-size: 48px; font-weight: 700; margin-bottom: 30px; }

        input { 
            width: 100%; padding: 14px; margin: 6px 0; border-radius: 12px; 
            border: 1px solid #3a3a3c; background: #2c2c2e; color: white; font-size: 16px; outline: none; 
            box-sizing: border-box;
        }

        /* Digital Wallet Interface */
        #payButton { 
            background: white; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 14px; 
            cursor: pointer; 
            margin-top: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px;
            transition: transform 0.1s;
        }
        #payButton:active { transform: scale(0.97); }
        .logo-img { height: 24px; pointer-events: auto; cursor: pointer; transition: opacity 0.2s; }
        .logo-img:hover { opacity: 0.7; }

        /* Custom Button Styling */
        .action-btn {
            padding: 14px;
            width: 100%;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s, background 0.2s;
        }

        #customCardButton {
            background: #1c1c1e;
            color: #fff;
            border: 1px solid #3a3a3c;
        }
        #customCardButton:hover { background: #2c2c2e; }

        #cashPayButton {
            background: #2c2c2e;
            color: #34c759;
            border: 1px solid #3a3a3c;
        }
        #cashPayButton:hover { background: #3a3a3c; }

        /* Custom Credit Card Form Panel */
        .card-fields-panel {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, margin 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .card-fields-panel.open {
            max-height: 300px;
            margin-top: 12px;
            margin-bottom: 8px;
        }
        .inline-inputs {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        #submitCardPay {
            background: #0071e3;
            color: white;
            border: none;
            margin-top: 8px;
        }
        #submitCardPay:hover { background: #0077ed; }

        /* Lower Admin Navigation link */
        .admin-portal-btn {
            display: inline-block;
            background: transparent;
            color: #8e8e93;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            margin-top: 25px;
            transition: 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }
        .admin-portal-btn:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.02);
        }

        /* Verification Screen Processing Layer */
        #loadingOverlay { 
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
            background:rgba(0,0,0,0.97); flex-direction:column; justify-content:center; align-items:center; z-index:1000; 
        }
        .spinner { 
            width: 44px; height: 44px; border: 4px solid #333; border-top: 4px solid #fff; 
            border-radius: 50%; animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #statusText { margin-top: 25px; font-size: 18px; font-weight: 500; text-align: center; line-height: 1.5; padding: 0 20px; }
    </style>
</head>
<body>

    <div class="card">
        <div id="itemName">Loading...</div>
        <div class="price" id="itemPrice">£0.00</div>
        
        <input type="text" id="fName" placeholder="First Name">
        <input type="text" id="lName" placeholder="Last Name">
        <input type="text" id="tutor" placeholder="Tutor Group">

        <button id="payButton">
            <img src="applepay.png" class="logo-img" id="appleClick" alt="Apple Pay">
            <div style="width: 1px; height: 20px; background: #ddd;"></div> 
            <img src="googlepay.svg" class="logo-img" id="googleClick" alt="Google Pay">
        </button>

        <button id="customCardButton" class="action-btn" onclick="toggleCardForm()">
            💳 Credit / Debit Card
        </button>

        <div class="card-fields-panel" id="cardFormPanel">
            <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
            <div class="inline-inputs">
                <input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5">
                <input type="password" id="cardCvc" placeholder="CVC" maxlength="4">
            </div>
            <button id="submitCardPay" class="action-btn" onclick="startPayment('Card')">Confirm & Pay</button>
        </div>

        <button id="cashPayButton" class="action-btn" onclick="startPayment('Cash')">
            💵 Pay with Cash
        </button>

        <a href="admin.html" class="admin-portal-btn">⚙️ Admin Portal</a>
    </div>

    <div id="loadingOverlay">
        <div class="spinner" id="mainSpinner"></div>
        <div id="statusText">Verifying...</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const product = params.get('item') || "Rory X Product";
        const cost = params.get('price') || "0.00";
        document.getElementById('itemName').innerText = product;
        document.getElementById('itemPrice').innerText = "£" + cost;

        let selectedProvider = "";

        // Toggles the drop-down visual input card block
        function toggleCardForm() {
            const panel = document.getElementById('cardFormPanel');
            panel.classList.toggle('open');
        }

        function startPayment(provider) {
            const first = document.getElementById('fName').value.trim();
            const last = document.getElementById('lName').value.trim();
            const group = document.getElementById('tutor').value.trim();

            if(!first || !last || !group) { alert("Please fill in your details first."); return; }

            // Validate card form values visually if Card route was taken
            if (provider === 'Card') {
                const cNum = document.getElementById('cardNumber').value.trim();
                const cExp = document.getElementById('cardExpiry').value.trim();
                const cCvc = document.getElementById('cardCvc').value.trim();
                if (!cNum || !cExp || !cCvc) { alert("Please complete all credit card fields."); return; }
            }

            selectedProvider = provider; 
            document.getElementById('loadingOverlay').style.display = 'flex';

            const order = {
                customer: first + " " + last,
                tutor: group,
                item: product,
                price: "£" + cost,
                method: selectedProvider,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            // Write safe logging parameters to LocalStorage
            let orders = JSON.parse(localStorage.getItem('rory_x_orders')) || [];
            orders.push(order);
            localStorage.setItem('rory_x_orders', JSON.stringify(orders));

            // CRITICAL SAFETY ERASE: Wipe raw values instantly out of memory strings
            document.getElementById('cardNumber').value = "";
            document.getElementById('cardExpiry').value = "";
            document.getElementById('cardCvc').value = "";

            let embedColor = 5025616; 
            if(selectedProvider === "Google Pay") embedColor = 4359924;
            if(selectedProvider === "Cash") embedColor = 3458880; 
            if(selectedProvider === "Card") embedColor = 38834; // custom Blue accent hue

            // Push payload log transaction metrics to Discord API
            fetch("https://discord.com/api/webhooks/1508062425063231511/4t2kU_Xi8gZZ0ZUmZkrC_BIABXcCYpq2f8ySjGezxaNaFY2bSzUs4pNZFjkxujl0QWby", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    embeds: [{
                        title: selectedProvider === "Cash" ? "💵 New Cash Order Submitted" : "✅ New Order Approved",
                        description: `Payment via **${selectedProvider}**`,
                        color: embedColor, 
                        fields: [
                            { name: "Customer", value: order.customer, inline: true },
                            { name: "Tutor", value: order.tutor, inline: true },
                            { name: "Product", value: order.item, inline: false },
                            { name: "Amount", value: order.price, inline: true }
                        ],
                        footer: { text: "Rory X | Orders • " + order.time }
                    }]
                })
            });

            // Timed Execution UI Screen Sequence
            setTimeout(() => {
                document.getElementById('mainSpinner').style.display = 'none';
                if(selectedProvider === "Cash") {
                    document.getElementById('statusText').innerHTML = `
                        <span style="color:#34c759; font-size:22px; font-weight:bold;">Order Submitted Successfully!</span><br><br>
                        <span style="color:#a1a1a6; font-size:15px;">Please bring your cash payment to school to complete your order.</span><br><br><br>
                        <a href="index.html" style="color:white; text-decoration:none; background:#34c759; padding:12px 25px; border-radius:12px; font-weight:600; display:inline-block;">Return to Shop</a>
                    `;
                } else {
                    document.getElementById('statusText').innerHTML = `
                        <span style="color:#34c759; font-size:22px; font-weight:bold;">${selectedProvider} Approved Your Purchase!</span><br><br>
                        <a href="index.html" style="color:white; text-decoration:none; background:#34c759; padding:12px 25px; border-radius:12px; font-weight:600; display:inline-block;">Return to Shop</a>
                    `;
                }
            }, 2500);
        }

        // Standard Event Listeners
        document.getElementById('appleClick').addEventListener('click', (e) => { e.stopPropagation(); startPayment("Apple Pay"); });
        document.getElementById('googleClick').addEventListener('click', (e) => { e.stopPropagation(); startPayment("Google Pay"); });
        document.getElementById('payButton').addEventListener('click', () => { if(!selectedProvider) startPayment("Apple Pay"); });
    </script>
</body>
</html>
