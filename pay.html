<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Rory X</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .card { 
            background: #1c1c1e; 
            padding: 40px 30px; 
            border-radius: 28px; 
            width: 360px; 
            text-align: center; 
            border: 1px solid #333; 
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        #itemName { color: #8e8e93; font-size: 14px; text-transform: uppercase; margin-bottom: 8px; transition: color 0.3s ease; }
        .price { font-size: 48px; font-weight: 700; margin-bottom: 30px; }

        input { 
            width: 100%; padding: 14px; margin: 6px 0; border-radius: 12px; 
            border: 1px solid #3a3a3c; background: #2c2c2e; color: white; font-size: 16px; outline: none; 
            box-sizing: border-box;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        /* Discount Message Layout Styling */
        #discountMessage {
            font-size: 14px;
            font-weight: 500;
            margin: 4px 0 10px 0;
            display: none;
            width: 100%;
            text-align: left;
            padding-left: 4px;
        }
        .success-text { color: #34c759; }
        .error-text { color: #ff3b30; }

        /* Digital Wallet Interface - DISABLED STYLING */
        #payButton { 
            background: white; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 14px; 
            margin-top: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px;
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }
        .logo-img { height: 24px; pointer-events: none; }

        /* Custom Button Styling */
        .action-btn {
            padding: 14px;
            width: 100%;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s, background 0.2s, color 0.3s ease, border-color 0.3s ease;
        }

        /* Card Button - DISABLED STYLING */
        #customCardButton {
            background: #1c1c1e;
            color: #8e8e93;
            border: 1px solid #2c2c2e;
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        #cashPayButton {
            background: #2c2c2e;
            color: #34c759;
            border: 1px solid #3a3a3c;
        }
        #cashPayButton:hover { background: #3a3a3c; }
        #cashPayButton:active { transform: scale(0.97); }

        /* Custom Credit Card Form Panel */
        .card-fields-panel {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, margin 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .card-fields-panel.open {
            max-height: 300px;
            margin-top: 12px;
            margin-bottom: 8px;
        }
        .inline-inputs {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        #submitCardPay {
            background: #0071e3;
            color: white;
            border: none;
            margin-top: 8px;
        }
        #submitCardPay:hover { background: #0077ed; }

        /* Lower Admin Navigation link */
        .admin-portal-btn {
            display: inline-block;
            background: transparent;
            color: #8e8e93;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            margin-top: 25px;
            transition: 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }
        .admin-portal-btn:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.02);
        }

        /* Verification Screen Processing Layer */
        #loadingOverlay { 
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
            background:rgba(0,0,0,0.97); flex-direction:column; justify-content:center; align-items:center; z-index:1000; 
            transition: background 0.3s ease;
        }
        .spinner { 
            width: 44px; height: 44px; border: 4px solid #333; border-top: 4px solid #fff; 
            border-radius: 50%; animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #statusText { margin-top: 25px; font-size: 18px; font-weight: 500; text-align: center; line-height: 1.5; padding: 0 20px; }

        /* --- LIGHT MODE RULES OVERRIDES --- */
        body.light-mode {
            background-color: #ffffff;
            color: #000000;
        }
        body.light-mode .card {
            background: #f5f5f7;
            border: 1px solid #d1d1d6;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        body.light-mode #itemName {
            color: #48484a;
        }
        body.light-mode input {
            background: #ffffff;
            color: #000000;
            border: 1px solid #d1d1d6;
        }
        body.light-mode #cashPayButton {
            background: #e5e5ea;
            color: #27ae60;
            border: 1px solid #d1d1d6;
        }
        body.light-mode #cashPayButton:hover {
            background: #d1d1d6;
        }
        body.light-mode .admin-portal-btn {
            color: #48484a;
            border: 1px solid #d1d1d6;
        }
        body.light-mode .admin-portal-btn:hover {
            color: #000000;
            background: rgba(0, 0, 0, 0.02);
            border-color: #8e8e93;
        }
        body.light-mode #loadingOverlay {
            background: rgba(255, 255, 255, 0.98);
        }
        body.light-mode .spinner {
            border: 4px solid #e5e5ea;
            border-top: 4px solid #000000;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="itemName">Loading...</div>
        <div class="price" id="itemPrice">£0.00</div>
        
        <input type="text" id="fName" placeholder="First Name">
        <input type="text" id="lName" placeholder="Last Name">
        <input type="text" id="tutor" placeholder="Tutor Group">

        <input type="text" id="discountCode" placeholder="Discount Code" oninput="checkDiscountCode()">
        <p id="discountMessage"></p>

        <button id="payButton" disabled>
            <img src="applepay.png" class="logo-img" id="appleClick" alt="Apple Pay">
            <div style="width: 1px; height: 20px; background: #ddd;"></div> 
            <img src="googlepay.svg" class="logo-img" id="googleClick" alt="Google Pay">
        </button>

        <button id="customCardButton" class="action-btn" disabled>
            🔒 Card Payments Unavailable
        </button>

        <div class="card-fields-panel" id="cardFormPanel">
            <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19">
            <div class="inline-inputs">
                <input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5">
                <input type="password" id="cardCvc" placeholder="CVC" maxlength="4">
            </div>
            <button id="submitCardPay" class="action-btn" onclick="startPayment('Card')">Confirm & Pay</button>
        </div>

        <button id="cashPayButton" class="action-btn" onclick="startPayment('Cash')">
            💵 Pay with Cash in hand
        </button>

        <a href="admin.html" class="admin-portal-btn">⚙️ Admin Portal</a>
    </div>

    <div id="loadingOverlay">
        <div class="spinner" id="mainSpinner"></div>
        <div id="statusText">Verifying...</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const product = params.get('item') || "Rory X Product";
        const cost = params.get('price') || "0.00";
        
        // Internal pricing state management
        let baseCost = parseFloat(cost) || 0.00;
        let currentCost = baseCost;
        let selectedProvider = "";

        // Display initial price configuration
        document.getElementById('itemName').innerText = product;
        updatePriceDisplay();

        function updatePriceDisplay() {
            document.getElementById('itemPrice').innerText = "£" + currentCost.toFixed(2);
        }

        // Live validation tracking for the FREE10 discount code
        function checkDiscountCode() {
            const inputCode = document.getElementById('discountCode').value.trim().toUpperCase();
            const message = document.getElementById('discountMessage');
            
            if (inputCode === "FREE10") {
                currentCost = 0.00;
                message.innerText = "Promo applied: 100% off!";
                message.className = "success-text";
                message.style.display = "block";
            } else if (inputCode === "") {
                currentCost = baseCost;
                message.style.display = "none";
            } else {
                currentCost = baseCost;
                message.innerText = "Invalid discount code.";
                message.className = "error-text";
                message.style.display = "block";
            }
            updatePriceDisplay();
        }

        function toggleCardForm() {
            return;
        }

        async function startPayment(provider) {
            const first = document.getElementById('fName').value.trim();
            const last = document.getElementById('lName').value.trim();
            const group = document.getElementById('tutor').value.trim();

            if(!first || !last || !group) { alert("Please fill in your details first."); return; }

            selectedProvider = provider; 
            
            let displayMethod = selectedProvider;
            if (currentCost === 0) {
                displayMethod = selectedProvider + " (Promo Applied)";
            }

            document.getElementById('loadingOverlay').style.display = 'flex';

            const orderPayload = {
                customer: first + " " + last,
                tutor: group,
                item: product,
                price: "£" + currentCost.toFixed(2),
                method: displayMethod,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            try {
                const response = await fetch('/api/submit-orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });

                if (!response.ok) {
                    const errorMsg = await response.text();
                    throw new Error(errorMsg || 'Server rejected checkout transaction payload');
                }

                let embedColor = 3458880;

                fetch("https://discord.com/api/webhooks/1508062425063231511/4t2kU_Xi8gZZ0ZUmZkrC_BIABXcCYpq2f8ySjGezxaNaFY2bSzUs4pNZFjkxujl0QWby", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: "💵 New Cash Order Submitted",
                            description: `Payment via **${displayMethod}**`,
                            color: embedColor, 
                            fields: [
                                { name: "Customer", value: orderPayload.customer, inline: true },
                                { name: "Tutor", value: orderPayload.tutor, inline: true },
                                { name: "Product", value: orderPayload.item, inline: false },
                                { name: "Amount", value: orderPayload.price, inline: true }
                            ],
                            footer: { text: "Rory X | Orders • " + orderPayload.time }
                        }]
                    })
                }).catch(err => console.error("Discord webhook update connection loss:", err));

                setTimeout(() => {
                    document.getElementById('mainSpinner').style.display = 'none';
                    
                    const isLight = document.body.classList.contains('light-mode');
                    const textStyle = isLight ? 'color:#1c1c1e;' : 'color:white;';

                    document.getElementById('statusText').innerHTML = `
                        <span style="color:#34c759; font-size:22px; font-weight:bold;">Order Submitted Successfully!</span><br><br>
                        <span style="color:#a1a1a6; font-size:15px;">${currentCost === 0 ? 'Your free order is ready!' : 'Please bring your cash payment to school to complete your order.'}</span><br><br><br>
                        <a href="index.html" style="${textStyle} text-decoration:none; background:#34c759; padding:12px 25px; border-radius:12px; font-weight:600; display:inline-block;">Return to Shop</a>
                    `;
                }, 2500);

            } catch (err) {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert("Checkout Transaction Error: " + err.message);
            }
        }

        // --- Theme Engine Auto Sync Configuration ---
        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem('roryx-theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
            }
        });
    </script>
</body>
</html>
