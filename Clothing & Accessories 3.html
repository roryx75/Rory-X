<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing & Accessories - Page 3 | Rory X</title>
    <link rel="icon" type="image/png" href="RoryX.png">
    <style>
        /* Mobile Fix */
        @media (max-width: 768px) {
            nav { padding: 0 20px; height: 80px; }
            .nav-logo { height: 60px; }
            nav ul { gap: 15px; }
            nav a { font-size: 12px; }
            .nav-spacer { display: none; }
            .page-wrapper { margin-top: 120px; width: 90%; }
            .product-grid { grid-template-columns: 1fr; gap: 20px; justify-content: center; }
            .product-card { padding: 20px; border-radius: 24px; width: 100%; max-width: 280px; }
            .img-box { height: 160px; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: #000; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-top: 120px; }
        
        /* Navigation Bar */
        nav { 
            position: fixed; top: 0; left: 0; width: 100%; height: 90px; 
            background: #000; display: grid; grid-template-columns: 1fr auto 1fr; 
            align-items: center; padding: 0 40px; z-index: 1000; box-sizing: border-box;
            border-bottom: 1px solid #1c1c1e;
        }
        .logo-section { display: flex; justify-content: flex-start; }
        .logo-section img { height: 40px; width: auto; }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a { color: white; text-decoration: none; font-size: 15px; font-weight: 500; opacity: 0.6; transition: opacity 0.2s; }
        .nav-links a:hover { opacity: 1; }

        .page-wrapper { width: 95%; max-width: 1000px; display: flex; flex-direction: column; gap: 40px; margin-bottom: 80px; }
        
        /* Layout Grid sized for 3 items in a row */
        .product-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 0 auto; padding: 20px; width: 100%; }
        
        /* Scaled-down Card Styling */
        .product-card { 
            background: #1c1c1e; border: 1px solid #333; border-radius: 24px; 
            padding: 20px; width: 240px; text-align: left; transition: transform 0.3s ease;
        }
        .product-card:hover { transform: translateY(-8px); border-color: #444; }
        
        .img-box { height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        .img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .product-card h3 { margin: 10px 0 5px; font-size: 18px; font-weight: 600; color: white; text-align: left; }
        .price-text { color: #8e8e93; margin-bottom: 15px; font-weight: 600; font-size: 15px; display: block; }

        .buy-now-btn { 
            width: 100%; padding: 12px; background: #2ecc71; color: white; 
            border: none; border-radius: 12px; font-weight: bold; text-align: center;
            text-decoration: none; display: inline-block; cursor: pointer; transition: background 0.2s; font-size: 15px;
        }
        .buy-now-btn:hover { background: #27ae60; }

        /* Pagination Setup */
        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 60px; align-items: center; width: 100%; }
        .page-link { background: rgba(255,255,255,0.08); color: white; padding: 12px 24px; border-radius: 12px; text-decoration: none; font-weight: 600; }
        .page-link.active { background: #34c759; }

        footer { width: 100%; padding: 60px 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: center; color: #a1a1a6; font-size: 14px; margin-top: auto; }
        .social-link { text-decoration: none; display: flex; align-items: center; gap: 8px; color: #a1a1a6; transition: 0.3s; }
        .social-link img { width: 20px; height: 20px; }
        .social-link:hover { color: #fff; }
    </style>
</head>
<body>

    <nav>
        <div class="logo-section">
            <img src="RoryX.png" alt="Rory X Logo">
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="Clothing & Accessories.html">Clothing & Accessories</a>
            <a href="about.html">About Us</a>
        </div>
        <div></div>
    </nav>

    <div class="page-wrapper">
        <div class="product-grid">
            <div class="product-card">
                <div class="img-box"><img src="placeholder-item1.png" alt="New Item 1"></div>
                <h3>Rory X Premium Item</h3>
                <span class="price-text">£12.00</span>
                <a href="pay.html?item=Rory%20X%20Premium%20Item&price=12.00" class="buy-now-btn">Buy Now</a>
            </div>

            <div class="product-card">
                <div class="img-box"><img src="placeholder-item2.png" alt="New Item 2"></div>
                <h3>Rory X Luxury Accessory</h3>
                <span class="price-text">£20.00</span>
                <a href="pay.html?item=Rory%20X%20Luxury%20Accessory&price=20.00" class="buy-now-btn">Buy Now</a>
            </div>

            <div class="product-card">
                <div class="img-box"><img src="placeholder-item3.png" alt="New Item 3"></div>
                <h3>Rory X Special Edition</h3>
                <span class="price-text">£15.00</span>
                <a href="pay.html?item=Rory%20X%20Special%20Edition&price=15.00" class="buy-now-btn">Buy Now</a>
            </div>
        </div>

        <div class="pagination">
            <a href="Clothing & Accessories 2.html" style="color: #34c759; text-decoration: none; font-weight: 600; margin-right: 15px;">← Previous Page</a>
            <a href="Clothing & Accessories.html" class="page-link">1</a>
            <a href="Clothing & Accessories 2.html" class="page-link">2</a>
            <a href="Clothing & Accessories 3.html" class="page-link active">3</a>
        </div>
    </div>

    <footer>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <p>&copy; Copyright 2026 Rory X | Support: roryx.com@hotmail.com</p>
            <div style="display: flex; gap: 30px; justify-content: center; align-items: center;">
                <a href="https://www.tiktok.com/@roryx.com" target="_blank" class="social-link">
                    <img src="tiktokimage.png" alt="TikTok"> <span>Rory X</span>
                </a>
                <a href="https://www.instagram.com/roryx.com75/" target="_blank" class="social-link">
                    <img src="instagramimage.svg" alt="Instagram"> <span>Rory X</span>
                </a>
                <a href="https://www.youtube.com/channel/UC2tOn7rCPzN3jH5xoDFV5Fg" target="_blank" class="social-link">
                    <img src="youtubeimage.png" alt="YouTube"> <span>Rory X</span>
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
