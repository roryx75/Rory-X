<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing & Accessories - Page 3 | Rory X</title>
    <link rel="icon" type="image/png" href="RoryX.png">
    <style>
        /* Mobile Fix */
        @media (max-width: 768px) {
            nav { padding: 15px 20px; height: auto; display: flex !important; flex-direction: column; gap: 10px; }
            .nav-logo { height: 60px; }
            nav ul { gap: 15px; justify-content: center; }
            nav a { font-size: 12px; }
            .page-wrapper { margin-top: 220px; width: 90%; }
            .product-grid { grid-template-columns: 1fr; gap: 20px; }
            .product-card { padding: 40px 20px; border-radius: 30px; }
            .product-card img { height: 200px; }
            .nav-actions { margin-top: 5px; justify-content: center; flex-wrap: wrap; position: static; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
        body { background-color: #000; color: #f5f5f7; display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: background-color 0.3s ease, color 0.3s ease; }
        
        /* Button & Interactive Element Base Styles */
        .theme-toggle-btn, .cart-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .theme-toggle-btn:hover, .cart-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.03);
        }

        .cart-btn {
            background: rgba(52, 199, 89, 0.2);
            border-color: rgba(52, 199, 89, 0.4);
            color: #34c759;
        }
        .cart-btn:hover {
            background: rgba(52, 199, 89, 0.3);
        }

        /* --- NEW LIVE STOCK DROPDOWN INTERFACE --- */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .stock-trigger-btn {
            background: rgba(52, 199, 89, 0.1);
            color: #34c759;
            border: 1px solid rgba(52, 199, 89, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .stock-trigger-btn:hover {
            background: rgba(52, 199, 89, 0.2);
            transform: scale(1.03);
        }
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 10px);
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            min-width: 180px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 10000;
            overflow: hidden;
        }
        .dropdown-menu.active {
            display: block;
        }
        .dropdown-menu a {
            display: block;
            color: #f5f5f7;
            padding: 12px 16px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.8;
            transition: background 0.2s ease, opacity 0.2s ease;
            text-align: left;
        }
        .dropdown-menu a:hover {
            background: rgba(255, 255, 255, 0.08);
            opacity: 1;
        }
        .dropdown-menu a:not(:last-child) {
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
        }

        /* --- LIGHT MODE RULES OVERRIDES --- */
        body.light-mode {
            background-color: #ffffff;
            color: #000000;
        }
        body.light-mode nav {
            background: rgba(255, 255, 255, 0.8);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
        }
        body.light-mode nav a {
            color: #000000;
            opacity: 0.7;
        }
        body.light-mode nav a:hover {
            opacity: 1;
        }
        body.light-mode .theme-toggle-btn {
            background: rgba(0, 0, 0, 0.05);
            color: #000000;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }
        body.light-mode .theme-toggle-btn:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        body.light-mode .dropdown-menu {
            background: rgba(245, 245, 247, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        body.light-mode .dropdown-menu a {
            color: #000000;
        }
        body.light-mode .dropdown-menu a:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        body.light-mode .dropdown-menu a:not(:last-child) {
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
        }
        body.light-mode .product-card {
            background: #f5f5f7;
            border: 1px solid #d1d1d6;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        body.light-mode .product-card span { color: #48484a; }
        body.light-mode footer { border-top: 1px solid rgba(0, 0, 0, 0.08); color: #48484a; }
        body.light-mode .social-link { color: #48484a; }
        body.light-mode .social-link:hover { color: #000000; }
        body.light-mode .page-link { background: rgba(0, 0, 0, 0.05); color: #000000; }
        body.light-mode .page-link.active { background: #34c759; color: white; }
        body.light-mode .buy-now-btn.disabled { background-color: #000000 !important; color: #ffffff !important; }

        /* --- NAVIGATION LAYOUT --- */
        nav { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            height: 110px; 
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            display: flex; 
            align-items: center; 
            padding: 0 40px; 
            z-index: 9999; 
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08); 
            transition: background 0.3s ease, border-bottom 0.3s ease;
        }
        .nav-logo { 
            height: 100px; 
            width: auto; 
            position: absolute; 
            left: 40px; 
        }
        nav ul { 
            display: flex; 
            list-style: none; 
            gap: 40px; 
            align-items: center; 
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        nav a { text-decoration: none; color: #f5f5f7; font-size: 14px; opacity: 0.7; transition: 0.3s; }
        nav a:hover { opacity: 1; }
        
        .nav-actions {
            position: absolute;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .page-wrapper { margin-top: 150px; width: 95%; max-width: 1200px; display: flex; flex-direction: column; gap: 40px; margin-bottom: 80px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 40px; }
        .product-card { 
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 45px; padding: 50px 40px; text-align: center; backdrop-filter: blur(20px); 
            display: flex; flex-direction: column; justify-content: space-between; transition: 0.4s ease, background-color 0.3s ease, border-color 0.3s ease;
        }
        .product-card img { width: 100%; height: 260px; object-fit: contain; margin-bottom: 30px; }
        .product-card h3 { font-size: 24px; font-weight: 600; margin-bottom: 10px; }
        .product-card span { font-size: 18px; color: #a1a1a6; margin-bottom: 15px; display: block; transition: color 0.3s ease; }

        /* Stock Tag System */
        .stock-tag-container { min-height: 25px; }
        .stock-tag { font-size: 13px; font-weight: 600; margin-bottom: 20px; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; display: inline-block; }
        .in-stock { color: #34c759; background: rgba(52, 199, 89, 0.1); }
        .low-stock { color: #ff9500; background: rgba(255, 149, 0, 0.1); }
        .out-of-stock { color: #ff3b30; background: rgba(255, 59, 48, 0.1); }

        .buy-now-btn { 
            background-color: #34c759; color: white; padding: 16px 50px; 
            border-radius: 14px; text-decoration: none; font-weight: 600; 
            font-size: 17px; transition: 0.3s; align-self: center; width: 100%; text-align: center; display: inline-block;
            cursor: pointer; border: none;
        }
        .buy-now-btn:hover { background-color: #2da44e; transform: scale(1.03); }
        .buy-now-btn.disabled { 
            background-color: #ffffff !important; 
            color: #1c1c1e !important; 
            cursor: not-allowed; 
            transform: none !important; 
            box-shadow: none !important; 
        }

        .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 60px; align-items: center; width: 100%; }
        .page-link { background: rgba(255,255,255,0.08); color: white; padding: 12px 24px; border-radius: 12px; text-decoration: none; font-weight: 600; transition: background 0.3s ease, color 0.3s ease; }
        .page-link.active { background: #34c759; }

        footer { width: 100%; padding: 60px 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: center; color: #a1a1a6; font-size: 14px; transition: border-top 0.3s ease, color 0.3s ease; }
        .social-link { text-decoration: none; display: flex; align-items: center; gap: 8px; color: #a1a1a6; transition: 0.3s; }
        .social-link img { width: 20px; height: 20px; }
        .social-link:hover { color: #fff; }
    </style>
</head>
<body>

    <nav>
        <img src="RoryX.png" alt="Rory X" class="nav-logo" id="navLogo">
        
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="Clothing & Accessories.html">Clothing & Accessories</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>

        <div class="nav-actions">
            <div class="dropdown">
                <button class="stock-trigger-btn" id="stockBtn" onclick="toggleStockMenu(event)">📈 Live Stock</button>
                <div class="dropdown-menu" id="stockDropdown">
                    <a href="admin.html">View Public Stock</a>
                    <a href="privatestock.html">View Private Stock</a>
                </div>
            </div>
            <a href="cart.html" class="cart-btn" id="cartBtn">🛒 Cart (0)</a>
            <button class="theme-toggle-btn" onclick="toggleDisplayTheme()" id="themeBtn">☀️ Light Mode</button>
        </div>
    </nav>

    <div class="page-wrapper">
        <div class="product-grid">
            <div class="product-card" data-product-name="Rory X Hoodie" data-price="15.00" data-img="Hoodie1,2.png">
                <div>
                    <img src="Hoodie1,2.png" alt="Rory X Hoodie">
                    <h3>Rory X Hoodie</h3>
                    <span>£15.00</span>
                </div>
                <div style="width: 100%;">
                    <div class="stock-tag-container"></div>
                    <button onclick="addToCart('Rory X Hoodie')" class="buy-now-btn">Add to Cart</button>
                </div>
            </div>

            <div class="product-card" data-product-name="Rory X Jewelry Box" data-price="15.00" data-img="Jewelry Box.png">
                <div>
                    <img src="Jewelry Box.png" alt="Rory X Jewelry Box">
                    <h3>Rory X Jewelry Box</h3>
                    <span>£15.00</span>
                </div>
                <div style="width: 100%;">
                    <div class="stock-tag-container"></div>
                    <button onclick="addToCart('Rory X Jewelry Box')" class="buy-now-btn">Add to Cart</button>
                </div>
            </div>
        </div> 
        
        <div class="pagination">
            <a href="Clothing & Accessories 2.html" style="color: #34c759; text-decoration: none; font-weight: 600; margin-right: 15px;">← Previous Page</a>
            <a href="Clothing & Accessories.html" class="page-link">1</a>
            <a href="Clothing & Accessories 2.html" class="page-link">2</a>
            <a href="Clothing & Accessories 3.html" class="page-link active">3</a>
        </div>
    </div>

    <footer>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
            <p>&copy; Copyright 2026 Rory X | Support: roryx.com@hotmail.com</p>
            <div style="display: flex; gap: 30px; justify-content: center; align-items: center;">
                <a href="https://www.tiktok.com/@roryx.com" target="_blank" class="social-link">
                    <img src="tiktokimage.png" alt="TikTok"> <span>Rory X</span>
                </a>
                <a href="https://www.instagram.com/roryx.com75/" target="_blank" class="social-link">
                    <img src="instagramimage.svg" alt="Instagram"> <span>Rory X</span>
                </a>
                <a href="https://www.youtube.com/channel/UC2tOn7rCPzN3jH5xoDFV5Fg" target="_blank" class="social-link">
                    <img src="youtubeimage.png" alt="YouTube"> <span>Rory X</span>
                </a>
            </div>
        </div>
    </footer>

    <script>
        // --- Navigation Dropdown Control ---
        function toggleStockMenu(event) {
            event.stopPropagation();
            document.getElementById('stockDropdown').classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('stockDropdown');
            const button = document.getElementById('stockBtn');
            if (dropdown && !button.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.classList.remove('active');
            }
        });

        // --- Shopping Cart Engine Logic ---
        function getCart() {
            return JSON.parse(localStorage.getItem('roryx-cart')) || [];
        }

        function updateCartBadge() {
            const cart = getCart();
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartBtn').innerText = `🛒 Cart (${totalCount})`;
        }

        function addToCart(productName) {
            const card = document.querySelector(`[data-product-name="${productName}"]`);
            if (!card) return;

            const btn = card.querySelector('.buy-now-btn');
            if (btn.classList.contains('disabled')) return;

            const price = parseFloat(card.getAttribute('data-price'));
            const img = card.getAttribute('data-img');
            
            let cart = getCart();
            const existingItem = cart.find(item => item.name === productName);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ name: productName, price: price, img: img, quantity: 1 });
            }

            localStorage.setItem('roryx-cart', JSON.stringify(cart));
            updateCartBadge();
            
            // UI feedback response
            btn.innerText = "Added! ✓";
            btn.style.backgroundColor = "#27ae60";
            setTimeout(() => {
                btn.innerText = "Add to Cart";
                btn.style.backgroundColor = "";
            }, 1000);
        }

        // --- Live Database Synchronizer Logic ---
        async function fetchLiveStock() {
            try {
                const response = await fetch('/api/get-stock?t=' + Date.now());
                if (!response.ok) throw new Error('API fetch error');
                const liveStock = await response.json();
                
                const containers = document.querySelectorAll('[data-product-name]');
                containers.forEach(container => {
                    const prodName = container.getAttribute('data-product-name');
                    const btn = container.querySelector('.buy-now-btn');
                    const tagBox = container.querySelector('.stock-tag-container');

                    if (liveStock && Object.prototype.hasOwnProperty.call(liveStock, prodName)) {
                        const count = parseInt(liveStock[prodName]);

                        if (count <= 0 || isNaN(count)) {
                            tagBox.innerHTML = `<span class="stock-tag out-of-stock">Sold Out</span>`;
                            btn.innerText = "Sold Out";
                            btn.classList.add('disabled');
                        } else if (count <= 3) {
                            tagBox.innerHTML = `<span class="stock-tag low-stock">Running Low: ${count} Left</span>`;
                            btn.innerText = "Add to Cart";
                            btn.classList.remove('disabled');
                        } else {
                            tagBox.innerHTML = `<span class="stock-tag in-stock">${count} In Stock</span>`;
                            btn.innerText = "Add to Cart";
                            btn.classList.remove('disabled');
                        }
                    }
                });
            } catch (err) {
                console.error("Live stock lookup failed, retrying on next pass:", err);
            }
        }

        // --- Theme Engine Script Systems ---
        function toggleDisplayTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            const logo = document.getElementById('navLogo');
            
            body.classList.toggle('light-mode');
            
            if(body.classList.contains('light-mode')) {
                btn.innerHTML = "🌙 Dark Mode";
                logo.src = "roryxlite.png";
                localStorage.setItem('roryx-theme', 'light');
            } else {
                btn.innerHTML = "☀️ Light Mode";
                logo.src = "RoryX.png";
                localStorage.setItem('roryx-theme', 'dark');
            }
        }

        // Initialize script execution and preference tracking
        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem('roryx-theme');
            if(savedTheme === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('themeBtn').innerHTML = "🌙 Dark Mode";
                document.getElementById('navLogo').src = "roryxlite.png";
            }

            updateCartBadge();
            fetchLiveStock();
            setInterval(fetchLiveStock, 5000);
        });
    </script>
</body>
</html>
